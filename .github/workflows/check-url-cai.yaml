name: 检查链接有效性

on:
  workflow_dispatch:
    inputs:
      fail_level:
        type: choice
        description: 错误等级
        required: true
        default: 默认
        options:
          - 默认
          - 错误
          - 详细
          - 不失败
      fork:
        description: 检查的 fork 仓库的所有者
        required: true
        default: microsoft
      branch:
        description: 检查的分支
        required: true
        default: master
      max_concurrency:
        description: 最大并发数
        required: true
        default: "8"
      mode:
        type: choice
        description: 生成模式
        required: true
        default: Release
        options:
          - Release
          - Debug

permissions: {}

jobs:
  Check-installers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 完整
        subdirectory: ["1", "2", "3", "4", "5", "6", "7", "8", "a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"]
        # 仅字母
        # subdirectory: ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"]
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: checker/

      - name: 设置 .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: 检出 winget-pkgs fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.fork }}/winget-pkgs
          ref: ${{ inputs.branch }}
          path: winget-pkgs
          persist-credentials: false
          sparse-checkout: manifests/${{ matrix.subdirectory }}/

      - name: 执行检查
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUTS_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
          INPUTS_MODE: ${{ inputs.mode }}
          INPUTS_FAIL_LEVEL: ${{ inputs.fail_level }}
        run: dotnet run --project "checker/checker.csproj" --configuration ${INPUTS_MODE} -- ${{ matrix.subdirectory }} ${INPUTS_FAIL_LEVEL} ${INPUTS_MAX_CONCURRENCY}
        continue-on-error: ${{ inputs.fail_level == '不失败' }}
